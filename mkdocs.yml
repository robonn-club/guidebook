site_name: Mobile Robotics Guidebook
site_url: https://robonn-club.github.io/guidebook/
site_description: A practitioner-focused guide to mobile robotics, maintained by Robonn — the Robotics Club at Universität Bonn.
repo_url: https://github.com/robonn-club/guidebook
repo_name: robonn-club/guidebook

docs_dir: docs
site_dir: site

# TEMPLATE.md is a contributor scaffold, not a page.
exclude_docs: |
  courses/TEMPLATE.md

# Built and linked from the home page, but deliberately kept out of the sidebar.
not_in_nav: |
  CONTRIBUTING.md

# Defining plugins disables the implicit `search`, so it is listed explicitly.
# `privacy` self-hosts external assets (Google Fonts, MathJax) at build time.
plugins:
  - search
  - privacy

# MkDocs defaults several of these to `info`, which --strict ignores.
# Raised to `warn` so --strict actually fails the build on a dead link.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  logo: assets/robonn_logo.png
  favicon: assets/robonn_logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font:
    text: Manrope
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/extra.css

# SVG output, not CHTML: CHTML fetches its web fonts at runtime, which `privacy`
# cannot see to self-host, so on the live site they 404. SVG needs no font files.
# TeX input only (not tex-mml-*): the MathML reader re-typesets MathJax's own hidden
# accessibility markup when mathjax.js re-runs, nesting every equation twice.
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-svg.js

nav:
  - Home: index.md
  - Courses:
      - courses/README.md
      - Math & Probability: courses/1_math_and_probability/README.md
      - Python for Robotics: courses/2_python/README.md
      - Sensor & Motion Models: courses/3_sensor_motion_models/README.md
      - State Estimation: courses/4_state_estimation/README.md
      - Localization: courses/5_localization/README.md
      - Mapping: courses/6_mapping/README.md
      - Control & Planning: courses/11_control_and_planning/README.md
      - Computer Vision: courses/8_computer_vision/README.md
      - Inertial Navigation: courses/9_inertial_navigation/README.md
      - Global Navigation Satellite Systems: courses/10_global_navigation/README.md
      - SLAM: courses/7_slam/README.md
      - Machine Learning: courses/12_machine_learning/README.md
      - C++ for Robotics: courses/13_cpp/README.md
