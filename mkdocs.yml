site_name: Mobile Robotics Guidebook
site_url: https://robonn-club.github.io/guidebook/
site_description: A practitioner-focused guide to mobile robotics, maintained by Robonn — the Robotics Club at Universität Bonn.
repo_url: https://github.com/robonn-club/guidebook
repo_name: robonn-club/guidebook

docs_dir: docs
site_dir: site

# Contributor template, not a published page
exclude_docs: |
  courses/TEMPLATE.md

# Fail `mkdocs build --strict` on any link that doesn't resolve
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: assets/robonn_logo.png
  favicon: assets/robonn_logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font:
    text: Manrope
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [examples]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/demos.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

watch:
  - examples

nav:
  - Home: index.md
  - Start Here:
      - start-here/index.md
      - "1 · Where am I? The Bayes filter": start-here/1-bayes-filter.md
      - "2 · The Kalman filter": start-here/2-kalman-filter.md
      - "3 · Localizing a real robot: the EKF": start-here/3-ekf-localization.md
      - "4 · The particle filter": start-here/4-particle-filter.md
  - Courses:
      - courses/README.md
      - Math & Probability: courses/1_math_and_probability/README.md
      - Python for Robotics: courses/2_python/README.md
      - Sensor & Motion Models: courses/3_sensor_motion_models/README.md
      - State Estimation: courses/4_state_estimation/README.md
      - Localization: courses/5_localization/README.md
      - Mapping: courses/6_mapping/README.md
      - Control & Planning: courses/11_control_and_planning/README.md
      - Computer Vision: courses/8_computer_vision/README.md
      - Inertial Navigation: courses/9_inertial_navigation/README.md
      - Global Navigation Satellite Systems: courses/10_global_navigation/README.md
      - SLAM: courses/7_slam/README.md
      - Machine Learning: courses/12_machine_learning/README.md
      - C++ for Robotics: courses/13_cpp/README.md
  - Contribute: CONTRIBUTING.md
