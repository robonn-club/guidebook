name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      # Live-site URLs are skipped: a page added by this PR is not deployed yet,
      # so its link would 404 until after merge. check.yml's strict build covers
      # internal links, and the weekly check covers the live site.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --max-concurrency 4
            --accept 200,206,429
            --exclude '^https://robonn-club\.github\.io/guidebook/'
            'docs/**/*.md' 'examples/*.md' 'README.md'
          fail: true
